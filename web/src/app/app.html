<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
  <div class="header__inner container">
    <a class="brand" [routerLink]="['/']">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.8 3.8L12 11.9 5.2 8.1 12 4.3ZM5 9.8l6 3.4v6.5l-6-3.3V9.8Zm8 9.9v-6.5l6-3.4v6.6l-6 3.3Z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="brand__name">Servio</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a
        class="nav__link"
        [routerLink]="['/']"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Browse</a
      >
      <span class="nav__link nav__link--muted" aria-disabled="true">Orders</span>
      <span class="nav__link nav__link--muted" aria-disabled="true">Messages</span>
    </nav>

    <div class="header__actions">
      <app-chaos-panel />

      <button
        type="button"
        class="btn btn--icon btn--ghost theme-toggle"
        [attr.aria-label]="themeLabel()"
        [title]="themeLabel()"
        (click)="toggleTheme()"
      >
        @if (mode() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.7 5.7 1.4 1.4M4.9 4.9l1.4 1.4m0 11.4-1.4 1.4M19.1 4.9l-1.4 1.4M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 14.2A8.5 8.5 0 0 1 9.8 3 8.5 8.5 0 1 0 21 14.2Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>

      <button type="button" class="btn btn--primary btn--sm">Sign in</button>
    </div>
  </div>
</header>

<main id="main" class="main">
  <router-outlet />
</main>

<footer class="footer">
  <div class="footer__inner container">
    <p>Servio — technical challenge build. Mock API, seeded data, no external services.</p>
    <p class="footer__meta">Fonts self-hosted · images signed with the fixed bearer token</p>
  </div>
</footer>
